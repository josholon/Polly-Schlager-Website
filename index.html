<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLLY | Offizielle Website</title>
    <!-- Google Fonts: Stick No Bills + Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Stick+No+Bills:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome für Social Media Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>
<body>

    <main>
        <!-- Logo-Bereich -->
        <section class="logo-section">
            <img src="assets/logo.png" alt="POLLY Logo" class="main-logo">
        </section>

        <!-- Navigation zentriert unter dem Logo -->
        <nav class="main-nav">
            <ul>
                <li><a href="index.html" class="active">Startseite</a></li>
                <li><a href="band.html">Band</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>

<!-- Video-Bereich mit YouTube Embed & Custom Vorschaubild -->
        <section class="video-section">
            <div class="video-container">
                <!-- Dein Vorschaubild als Klick-Cover -->
                <div class="video-poster" onclick="playYouTubeVideo(this)">
                    <img src="assets/preview.png" alt="POLLY Video Preview">
                    <div class="play-button">▶</div>
                </div>

                <!-- Das YouTube Video mit korrekter Referrer-Policy -->
                <iframe 
                    id="yt-player"
                    src="https://www.youtube.com/embed/7wpr4LPUdHI?enablejsapi=1&rel=0" 
                    title="POLLY Video" 
                    frameborder="0" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <!-- Social Media Buttons unter dem Video -->
        <section class="social-links">
            <a href="https://www.facebook.com/pollyschlager" target="_blank" class="social-btn"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
            <a href="https://www.instagram.com/pollyschlager/" target="_blank" class="social-btn"><i class="fa-brands fa-instagram"></i> Instagram</a>
            <a href="https://open.spotify.com/intl-de/artist/2Kr74VAEgKYNVYNFnimlht?si=vDiy2jMmQtWyUvBTod0jZA" target="_blank" class="social-btn"><i class="fa-brands fa-spotify"></i> Spotify</a>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 POLLY. Alle Rechte vorbehalten.</p>
        <div class="footer-links">
            <a href="impressum.html">Impressum</a>
            <span>|</span>
            <a href="datenschutz.html">Datenschutz</a>
        </div>
    </footer>

<!-- JavaScript zum Ausblenden des Vorschaubilds & Autoplay -->
    <script>
        function playYouTubeVideo(cover) {
            cover.style.display = 'none';
            const iframe = document.getElementById('yt-player');
            // Nutzt den Query-Separator sauber, um Fehler 153 zu vermeiden
            const currentSrc = iframe.src;
            if (!currentSrc.includes('autoplay=1')) {
                iframe.src = currentSrc + (currentSrc.includes('?') ? '&' : '?') + 'autoplay=1';
            }
        }
    </script>
    
</body>
</html>
